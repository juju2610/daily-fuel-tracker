<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotation Calculator</title>
<style>
  :root{
    --ink:#1b2420;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#dcd6c8;
    --moss:#3f5d4c;
    --moss-dark:#2c4235;
    --clay:#b5633a;
    --clay-dark:#8f4a29;
    --muted:#6b6558;
    --mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding:24px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:20px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--clay);
    margin-bottom:8px;
  }
  h1{font-size:24px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-0.01em;}
  .sub{color:var(--muted);font-size:14px;line-height:1.5;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
  }
  .card h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin:0 0 14px;
  }

  label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink);}
  input[type=number]{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:14px;
    background:#fbfaf6;
    color:var(--ink);
    font-family:inherit;
  }
  input:focus{outline:2px solid var(--moss);outline-offset:1px;background:#fff;}

  .field{margin-bottom:14px;}

  .product-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .product-toggle button{
    flex:1;
    padding:11px 10px;
    border:1px solid var(--line);
    border-radius:9px;
    background:#fbfaf6;
    color:var(--muted);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    font-family:inherit;
  }
  .product-toggle button.active{
    background:var(--moss);
    border-color:var(--moss);
    color:#fff;
  }

  .option-row{display:flex;gap:8px;}
  .option-row button{
    flex:1;
    padding:10px;
    border:1px solid var(--line);
    border-radius:9px;
    background:#fbfaf6;
    color:var(--ink);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    font-family:inherit;
  }
  .option-row button.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }

  table{width:100%;border-collapse:collapse;margin-top:6px;}
  tbody td{
    padding:8px 2px;
    font-size:13.5px;
    border-top:1px solid var(--line);
  }
  tbody tr:first-child td{border-top:none;}
  td.label{color:var(--muted);}
  td.val{font-family:var(--mono);text-align:right;color:var(--ink);}
  tr.total td{font-weight:800;font-size:16px;border-top:2px solid var(--ink);padding-top:12px;}
  tr.total td.val{color:var(--moss-dark);}

  footer{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.6;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">QUOTATION TOOL</div>
    <h1>Sand &amp; Quarry Product Quotation</h1>
    <p class="sub">Enter the delivery distance to calculate the quoted price.</p>
  </header>

  <div class="card">
    <h2>Calculator</h2>

    <div class="product-toggle">
      <button type="button" id="btn-sand" class="active" onclick="setProduct('sand')">Sand</button>
      <button type="button" id="btn-quarry" onclick="setProduct('quarry')">Quarry Product</button>
    </div>

    <div class="field">
      <label for="distance">Distance (km)</label>
      <input type="number" id="distance" min="0" step="0.1" placeholder="e.g. 20" oninput="calculate()">
    </div>

    <div class="field" id="quarry-option-field" style="display:none;">
      <label>Quarry Fixed Fee</label>
      <div class="option-row">
        <button type="button" id="btn-opt-31" class="active" onclick="setQuarryOption(31)">RM 31.00</button>
        <button type="button" id="btn-opt-36" onclick="setQuarryOption(36)">RM 36.00</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Breakdown</h2>
    <table>
      <tbody id="breakdown-body"></tbody>
      <tfoot>
        <tr class="total"><td class="label">Total</td><td class="val" id="total-val">RM 0.00</td></tr>
      </tfoot>
    </table>
  </div>

  <footer>TEK WEE HARDWARE &amp; LOGISTIC SDN BHD</footer>
</div>

<script>
  var product = 'sand';
  var quarryOption = 31;

  var RATES = { sand: 0.25, quarry: 0.27 };
  var MARKUP = 0.20;
  var FIXED_SAND = 25.00;
  var COMMON_A = 3.50;
  var COMMON_B = 3.00;

  function setProduct(p){
    product = p;
    document.getElementById('btn-sand').classList.toggle('active', p === 'sand');
    document.getElementById('btn-quarry').classList.toggle('active', p === 'quarry');
    document.getElementById('quarry-option-field').style.display = (p === 'quarry') ? 'block' : 'none';
    calculate();
  }

  function setQuarryOption(v){
    quarryOption = v;
    document.getElementById('btn-opt-31').classList.toggle('active', v === 31);
    document.getElementById('btn-opt-36').classList.toggle('active', v === 36);
    calculate();
  }

  function fmt(n){
    return 'RM ' + n.toFixed(2);
  }

  function calculate(){
    var distance = parseFloat(document.getElementById('distance').value) || 0;
    var rate = RATES[product];
    var base = rate * distance;
    var withMarkup = base * (1 + MARKUP);
    var fixedFee = (product === 'sand') ? FIXED_SAND : quarryOption;

    var total = withMarkup + fixedFee + COMMON_A + COMMON_B;

    var rows = [
      ['Distance', distance.toFixed(1) + ' km'],
      [rate.toFixed(2) + ' &times; distance', fmt(base)],
      ['+ 20% markup', fmt(withMarkup)],
      ['+ Fixed fee' + (product === 'quarry' ? ' (RM ' + quarryOption.toFixed(2) + ')' : ''), fmt(withMarkup + fixedFee)],
      ['+ RM 3.50', fmt(withMarkup + fixedFee + COMMON_A)],
      ['+ RM 3.00', fmt(total)]
    ];

    var body = document.getElementById('breakdown-body');
    body.innerHTML = rows.map(function(r){
      return '<tr><td class="label">' + r[0] + '</td><td class="val">' + r[1] + '</td></tr>';
    }).join('');

    document.getElementById('total-val').textContent = fmt(total);
  }

  calculate();
</script>
</body>
</html>
